<!--
    파일 역할: webOS MP3 튜닝 앱의 화면 구조와 스크립트 로드 순서를 정의합니다.
    실제 동작은 js 폴더, 스타일은 css/style.css에서 관리합니다.
-->
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Astnova MP3 Player</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <main class="app-container">
        <header class="app-header">
            <div>
                <p class="app-label">ASTNOVA AUDIO</p>
                <h1>MP3 Player</h1>
            </div>

            <div id="statusText" class="status">
                준비
            </div>
        </header>

        <section class="content">
            <aside class="playlist-panel">
                <h2>재생 목록</h2>

                <ul
                    id="playlist"
                    class="playlist"
                    aria-label="재생 목록"
                ></ul>
            </aside>

            <section class="player-panel">
                <div class="album-art">
                    <span id="albumInitial">♪</span>
                </div>

                <div class="track-information">
                    <p class="now-playing-label">
                        NOW PLAYING
                    </p>

                    <h2 id="trackTitle">
                        음악을 선택하세요
                    </h2>

                    <p id="trackArtist" class="artist">
                        Unknown Artist
                    </p>
                </div>

                <audio
                    id="audioPlayer"
                    preload="metadata"
                ></audio>

                <div class="progress-area">
                    <div class="time-row">
                        <span id="currentTime">00:00</span>
                        <span id="duration">00:00</span>
                    </div>

                    <input
                        id="seekBar"
                        class="range-control focusable"
                        type="range"
                        min="0"
                        max="1000"
                        value="0"
                        aria-label="재생 위치"
                    >
                </div>

                <div class="controls">
                    <button
                        id="previousButton"
                        class="control-button focusable"
                        type="button"
                        aria-label="이전 곡"
                    >
                        ◀◀
                    </button>

                    <button
                        id="playButton"
                        class="control-button play-button focusable"
                        type="button"
                        aria-label="재생"
                    >
                        ▶
                    </button>

                    <button
                        id="nextButton"
                        class="control-button focusable"
                        type="button"
                        aria-label="다음 곡"
                    >
                        ▶▶
                    </button>

                    <button
                        id="stopButton"
                        class="control-button focusable"
                        type="button"
                        aria-label="정지"
                    >
                        ■
                    </button>
                </div>

                <div class="volume-area">
                    <span class="volume-label">볼륨</span>

                    <span class="volume-icon">🔊</span>

                    <input
                        id="volumeBar"
                        class="range-control volume-bar focusable"
                        type="range"
                        min="0"
                        max="100"
                        value="70"
                        aria-label="볼륨"
                    >

                    <span id="volumeValue">70%</span>
                </div>

                <p id="messageText" class="message">
                    재생할 MP3 파일을 선택하세요.
                </p>
            </section>
        </section>

        <footer class="help">
            <span>← → 포커스 이동</span>
            <span>↑ ↓ 목록 이동</span>
            <span>OK 선택</span>
            <span>재생 키 재생</span>
            <span>일시정지 키 일시정지</span>
        </footer>
    </main>

    <script
        src="vendor/mpg123-decoder.min.js?v=0.0.3"
        charset="UTF-8"
    ></script>
    <script src="js/html-audio-engine.js?v=0.0.3"></script>
    <script src="js/audio-engine.js?v=0.0.5"></script>
    <script src="js/player.js?v=0.0.3"></script>
    <script src="js/remote-control.js?v=0.0.3"></script>
    <script src="js/wasm-loader.js?v=0.0.5"></script>
    <script src="js/main.js?v=0.0.4"></script>
</body>
</html>
